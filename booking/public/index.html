<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a meeting</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap stack" id="app"><p class="muted">Loading…</p></main>
  <script type="module">
    import { api, esc, applyBranding, durationLabel } from '/common.js';
    const app = document.getElementById('app');
    try {
      const p = await api('/api/public/profile');
      applyBranding(p);
      const S = p.strings;
      document.title = p.owner_name || S.chooseMeeting;
      app.innerHTML = `
        ${p.owner_name || p.welcome_text ? `<header>${p.owner_name ? `<h1>${esc(p.owner_name)}</h1>` : ''}${p.welcome_text ? `<p class="muted">${esc(p.welcome_text)}</p>` : ''}</header>` : ''}
        <h2>${esc(S.chooseMeeting)}</h2>
        <div class="type-list">${p.types.map((t) => `
          <a class="card type-card stack" href="/book/${encodeURIComponent(t.slug)}" style="border-top-color:${esc(t.color)}">
            <h3>${esc(t.name)}</h3>
            <div class="pill">${t.durations.map((d) => durationLabel(d, p.language)).join(' / ')}</div>
            ${t.description ? `<p class="muted small">${esc(t.description.slice(0, 180))}${t.description.length > 180 ? '…' : ''}</p>` : ''}
          </a>`).join('')}</div>`;
    } catch (e) {
      app.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  </script>
</body>
</html>
